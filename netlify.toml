[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[dev]
  framework = "vite"
  command = "npm run dev -- --host 0.0.0.0"
  targetPort = 5173
  port = 8888
  publish = "dist"
  functions = "netlify/functions"
